    container.querySelectorAll('.filter-chip').forEach(function (btn) {
      btn.classList.remove('active');
    });

}

function jumpToFeaturePage(pageId) {
  closeChangelogModal();
  show(pageId);
  toast('Switched to ' + pageId.toUpperCase() + ' page.', 'ok');
}

function renderChangelog() {
  var el = $('changelog-body');
  if (!el) return;

  var q = normSearch(S.changelogSearch || '');
  var filter = S.changelogFilter || 'all';

  var filteredData = CHANGELOG_DATA.map(function (rel) {
    var items = rel.items.filter(function (item) {
      if (filter !== 'all' && item.type !== filter) return false;
      if (q) {
        var txt = normSearch(item.text);
        var lbl = normSearch(item.label);
        var ver = normSearch(rel.version);
        if (txt.indexOf(q) === -1 && lbl.indexOf(q) === -1 && ver.indexOf(q) === -1) return false;
      }
      return true;
    });
    return {
      version: rel.version,
      date: rel.date,
      tag: rel.tag,
      tagColor: rel.tagColor,
      spotlight: rel.spotlight,
      items: items
    };
  }).filter(function (rel) {
    return rel.items.length > 0;
  });

  if (!filteredData.length) {
    el.innerHTML = '<div class="empty text-xs text-slate-500 p-8 text-center bg-slate-50 rounded-2xl">' +
      '<i data-lucide="search-x" class="w-8 h-8 text-slate-400 mx-auto mb-2"></i>' +
      'No release updates match "' + esc(S.changelogSearch) + '".' +
      '</div>';
    refreshIcons();
    return;
  }

  var html = filteredData.map(function (rel, idx) {
    var isSpotlight = rel.spotlight && idx === 0 && !q && filter === 'all';
    var tagHtml = rel.tag ? '<span class="text-[10px] font-bold px-2 py-0.5 rounded-full border ' + rel.tagColor + '">' + esc(rel.tag) + '</span>' : '';

    var itemsHtml = rel.items.map(function (item) {
      var tagCls = 'tag-' + (item.type || 'feature');
      var jumpBtn = item.page
        ? '<button class="btn ghost text-[10px] py-0.5 px-2 rounded-lg font-bold ml-auto shrink-0 flex items-center gap-1 text-dswd-blue hover:bg-blue-50 cursor-pointer" onclick="jumpToFeaturePage(\'' + item.page + '\')"><span>Try ' + esc(item.pageLabel || '') + '</span> <i data-lucide="arrow-right" class="w-3 h-3"></i></button>'
        : '';

      return '<li class="flex items-start justify-between gap-2.5 leading-relaxed p-2 rounded-xl hover:bg-slate-50 transition-all">' +
        '<div class="flex items-start gap-2 flex-1">' +
          '<span class="tag-badge ' + tagCls + ' shrink-0 mt-0.5">' + esc(item.label) + '</span>' +
          '<span class="text-xs text-slate-700">' + esc(item.text) + '</span>' +
        '</div>' +
        jumpBtn +
      '</li>';
    }).join('');

    if (isSpotlight) {
      return '<div class="p-5 rounded-2xl bg-gradient-to-br from-indigo-50/90 via-blue-50/80 to-purple-50/90 border border-blue-200/90 shadow-sm">' +
        '<div class="flex items-center justify-between gap-2 mb-3">' +
          '<div class="flex items-center gap-2">' +
            '<span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>' +
            '<span class="font-black text-slate-900 text-base tracking-tight">v' + esc(rel.version) + '</span>' +
            tagHtml +
          '</div>' +
          '<span class="text-xs text-slate-500 font-bold">' + esc(rel.date) + '</span>' +
        '</div>' +
        '<ul class="space-y-1">' + itemsHtml + '</ul>' +
      '</div>';
    }

    return '<div class="changelog-entry p-4 rounded-2xl border border-slate-200/80 bg-white/80 shadow-sm">' +
      '<div class="flex items-center justify-between gap-2 mb-2 pb-2 border-b border-slate-100">' +
        '<div class="flex items-center gap-2">' +
          '<span class="font-black text-slate-900 text-sm tracking-tight">v' + esc(rel.version) + '</span>' +
          tagHtml +
        '</div>' +
        '<span class="text-xs text-slate-400 font-medium">' + esc(rel.date) + '</span>' +
      '</div>' +
      '<ul class="space-y-1">' + itemsHtml + '</ul>' +
    '</div>';
  }).join('');

  el.innerHTML = html;

  var searchInput = $('cl-search');
  if (searchInput) {
    searchInput.oninput = function () {
      S.changelogSearch = this.value;
      renderChangelog();
      var inp = $('cl-search');
      if (inp) {
        inp.focus();
        inp.setSelectionRange(inp.value.length, inp.value.length);
      }
    };
  }

  refreshIcons();
}

  $('btn-copy-changelog').addEventListener('click', function () {
    var lines = [];
    var currentVer = (CHANGELOG_DATA[0] && CHANGELOG_DATA[0].version) ? CHANGELOG_DATA[0].version : '2.6.0';
    lines.push('====================================================');
    lines.push('DSWD FIELD OFFICE CARAGA — KALAHI-CIDSS PCRP');
    lines.push('SYSTEM RELEASE NOTES & CHANGELOG (v' + currentVer + ')');
    lines.push('====================================================\n');

    CHANGELOG_DATA.forEach(function (rel) {
      lines.push('## v' + rel.version + ' (' + rel.date + ')' + (rel.tag ? ' [' + rel.tag + ']' : ''));
      rel.items.forEach(function (it) {
        lines.push('  • [' + it.label + '] ' + it.text);
      });
      lines.push('');
    });

    var txt = lines.join('\n');
    navigator.clipboard.writeText(txt).then(function () {
      toast('Complete Changelog copied to clipboard!', 'ok');
    }).catch(function () {
      toast('Failed to copy to clipboard.', 'err');
    });
  });
}

var _noAttRecords = [];
var NO_ATT_PAGE = 500;          // rows drawn per page; the filter still runs over every record
var _noAttShown = NO_ATT_PAGE;
var _noAttTimer = null;

/** Search box handler: debounced, and goes back to the first page. */
function onNoAttSearchInput() {
  clearTimeout(_noAttTimer);
  _noAttTimer = setTimeout(function () {
    _noAttShown = NO_ATT_PAGE;
    renderNoAttendeesTable();
  }, 200);
}

function openNoAttendeesModal(actCode, scope) {
  // 1. Open modal IMMEDIATELY upon user click (0ms latency, instant response)
  var modal = $('modal-no-attendees');
  if (modal) modal.classList.add('open');

  // Update header text immediately
  var titleEl = $('no-att-title');
  if (titleEl) {
    if (actCode && actCode !== 'ALL') {
      var actMeta = (S.overview && S.overview.activities && S.overview.activities.find(function (a) { return a.code === actCode; })) || null;
      var actName = actMeta ? actMeta.label : (actCode === 'prva' ? 'PRVA' : actCode);
      titleEl.textContent = actName + ' · Conducted with No Attendees';
    } else {
      titleEl.textContent = 'Activities Conducted with No Attendees';
    }
  }
  var searchInput = $('no-att-search');
  if (searchInput) searchInput.value = '';

  _noAttRecords = [];
  _noAttShown = NO_ATT_PAGE;
  clearTimeout(_noAttTimer);
  var searchScope = scope || 'AUTO';
  var candidates = [];

  // Helper to deduplicate records. One normalised key per record into a hash
  // set: O(1) per record. The previous version compared every record against
  // every candidate with six normAlpha() calls per pair (O(n^2)), and was fed
  // the same records again by each cached S.muni payload.
  var seen = Object.create(null);
  function addCandidate(rec) {
    if (!rec || !rec.actCode) return;
    var bgy = rec.barangay || (rec.level === 'Municipal' ? '— (Municipal Level)' : '—');
    var key = normAlpha(rec.province || '') + '|' + normAlpha(rec.municipality || '') + '|' +
              normAlpha(bgy) + '|' + String(rec.actCode).toLowerCase();
    if (seen[key]) return;
    seen[key] = true;
    candidates.push(Object.assign({}, rec, { barangay: bgy }));
  }

  // 1. Primary Source: Pre-computed region-wide records from backend overview/snapshot.
  //    This already holds every record, so the sources below are only fallbacks
  //    for when it is empty — re-adding the same records from them is pure cost.
  if (S.overview && S.overview.noAttendeesRecords && S.overview.noAttendeesRecords.length) {
    S.overview.noAttendeesRecords.forEach(addCandidate);
  }

  // 2. Secondary Source: All loaded municipal/regional entries in S.muni cache
  if (!candidates.length && S.muni) {
    Object.keys(S.muni).forEach(function (mk) {
      var item = S.muni[mk];
      if (item && item.noAttendeesRecords && item.noAttendeesRecords.length) {
        item.noAttendeesRecords.forEach(addCandidate);
      }
      if (item && item.barangays && item.barangays.length) {
        item.barangays.forEach(function (b) {
          Object.keys(b.activities || {}).forEach(function (k) {
            var act = b.activities[k];
            if (act && (act.status === 'No Attendees' || (act.attendees === 0 && (act.dateStart || act.fieldDate)))) {
              var actMeta = (item.activities && item.activities.find(function (a) { return a.code === k; })) ||
                            (S.overview && S.overview.activities && S.overview.activities.find(function (a) { return a.code === k; })) || null;
              addCandidate({
                province: b.province || item.province || '',
                municipality: b.municipality || item.municipality || '',
                barangay: b.barangay || '',
                actCode: k,
                actLabel: actMeta ? actMeta.label : k,
                seq: actMeta ? actMeta.seq : '',
                level: 'Barangay',
                dateStart: act.dateStart || '',
                dateEnd: act.dateEnd || '',
                fieldDate: act.fieldDate || act.dateStart || ''
              });
            }
          });
        });
      }
    });
  }

  // 3. Fallback: Active worksheet precomputed noAttendeesRecords
  var muniPick = $('mu-pick') ? $('mu-pick').value : '';
  var curMuniKey = muniPick || 'REGION';
  var d = S.muni[curMuniKey] || S.muni['REGION'] || S.muni['REGION_' + (S.muniProvFilter || 'ALL')] || (muniPick ? S.muni[muniPick.split('|')[1]] : null);
  if (!candidates.length && d && d.noAttendeesRecords && d.noAttendeesRecords.length) {
    d.noAttendeesRecords.forEach(addCandidate);
  }

  // 4. Fallback: Scan S.overview.barangayRows
  if (!candidates.length && S.overview && S.overview.barangayRows && S.overview.barangayRows.length) {
    S.overview.barangayRows.forEach(function (b) {
      Object.keys(b.activities || {}).forEach(function (k) {
        var act = b.activities[k];
        if (act && (act.status === 'No Attendees' || (act.attendees === 0 && (act.dateStart || act.fieldDate)))) {
          var actMeta = (S.overview.activities && S.overview.activities.find(function (a) { return a.code === k; })) || null;
          addCandidate({
            province: b.province || '',
            municipality: b.municipality || '',
            barangay: b.barangay || '',
            actCode: k,
            actLabel: actMeta ? actMeta.label : k,
            seq: actMeta ? actMeta.seq : '',
            level: 'Barangay',
            dateStart: act.dateStart || '',
            dateEnd: act.dateEnd || '',
            fieldDate: act.fieldDate || act.dateStart || ''
          });
        }
      });
    });
  }

  // Scoping logic
  var scoped = candidates;
  if (searchScope === 'DASH') {
    var dFilter = (S.dashScope && S.dashScope !== 'all' && S.dashScope !== 'ALL') ? S.dashScope : null;
    if (dFilter) {
      var dAlpha = normAlpha(dFilter);
      var filtered = scoped.filter(function (r) {
        return normAlpha(r.province) === dAlpha;
      });
      if (filtered.length) scoped = filtered;
    }
  } else if (searchScope === 'MUNI' || (searchScope === 'AUTO' && muniPick && muniPick !== 'REGION')) {
    var selVal = muniPick || (d && !d.isRegion ? (d.province ? d.province + '|' + d.municipality : d.municipality) : '');
    if (selVal) {
      var parts = selVal.indexOf('|') !== -1 ? selVal.split('|') : [null, selVal];
      var pTarget = parts[0] ? normAlpha(parts[0]) : '';
      var mTarget = normAlpha(parts[1]);
      var mFiltered = scoped.filter(function (r) {
        var mMatch = normAlpha(r.municipality) === mTarget;
        var pMatch = pTarget ? normAlpha(r.province) === pTarget : true;
        return mMatch && pMatch;
      });
      if (mFiltered.length) scoped = mFiltered;
    }
  } else {
    // REGION / Multi-LGU mode
    var pFilter = (S.muniProvFilter && S.muniProvFilter !== 'ALL' && S.muniProvFilter !== 'REGION') ? S.muniProvFilter : null;
    if (pFilter) {
      var pAlpha = normAlpha(pFilter);
      var regFiltered = scoped.filter(function (r) {
        return normAlpha(r.province) === pAlpha;
      });
      if (regFiltered.length) scoped = regFiltered;
    }
  }

  // Activity filtering
  if (actCode && actCode !== 'ALL') {
    var normAct = String(actCode).toLowerCase().replace(/^seq\s*/, '').trim();
    var actFiltered = scoped.filter(function (r) {
      var rCode = String(r.actCode || '').toLowerCase().trim();
      var rSeq = String(r.seq || '').toLowerCase().replace(/^seq\s*/, '').trim();
      var rLabel = String(r.actLabel || '').toLowerCase();

      if (normAct === 'prva' || normAct === '3') {
        return rCode === 'prva' || rSeq.indexOf('3.') === 0 || rSeq === '3' || rLabel.indexOf('prva') !== -1;
      }
      return rCode === normAct || rSeq === normAct || rLabel.indexOf(normAct) !== -1;
    });

    if (actFiltered.length) {
      scoped = actFiltered;
    } else {
      // Graceful fallback: check all candidates for activity match
      var fallbackAct = candidates.filter(function (r) {
        var rCode = String(r.actCode || '').toLowerCase().trim();
        var rSeq = String(r.seq || '').toLowerCase().replace(/^seq\s*/, '').trim();
        var rLabel = String(r.actLabel || '').toLowerCase();
        if (normAct === 'prva' || normAct === '3') {
          return rCode === 'prva' || rSeq.indexOf('3.') === 0 || rSeq === '3' || rLabel.indexOf('prva') !== -1;
        }
        return rCode === normAct || rSeq === normAct || rLabel.indexOf(normAct) !== -1;
      });
      if (fallbackAct.length) scoped = fallbackAct;
      else scoped = [];
    }
  }

  _noAttRecords = scoped;
  renderNoAttendeesTable();
  if (modal) refreshIcons(modal);
}

function renderNoAttendeesTable() {
  var el = $('no-att-body');
  var badge = $('no-att-count-badge');
  if (!el) return;

  var q = normSearch(($('no-att-search') ? $('no-att-search').value : '') || '');
  var list = _noAttRecords.filter(function (r) {
    if (!q) return true;
    // normalised once per record, not once per keystroke
    if (r._s === undefined) {
      r._s = normSearch(r.province + ' ' + r.municipality + ' ' + r.barangay + ' ' + r.actCode + ' ' + r.actLabel);
    }
    return r._s.indexOf(q) !== -1;
  });
  var total = list.length;
  var page = total > _noAttShown ? list.slice(0, _noAttShown) : list;

  if (badge) {
    badge.textContent = total + (total === 1 ? ' Record' : ' Records');
  }

  if (!list.length) {
    el.innerHTML = '<div class="p-8 text-center text-slate-400 dark:text-slate-500">' +
      '<i data-lucide="check-circle" class="w-12 h-12 mx-auto mb-2 text-emerald-500/60"></i>' +
      '<p class="text-sm font-semibold text-slate-600 dark:text-slate-300">No records found with missing attendance sheets.</p>' +
      (q ? '<p class="text-xs text-slate-400 mt-1">Try clearing your search query "' + esc(q) + '".</p>' : '') +
      '</div>';
    refreshIcons(el);
    return;
  }

  var html = '<div class="scroll"><table><thead><tr>' +
    '<th>Province</th><th>Municipality</th><th>Barangay / Scope</th>' +
    '<th>Activity</th><th>Conducted Date</th><th style="text-align:center">Action</th>' +
    '</tr></thead><tbody>' +
    page.map(function (r) {
      var dateTxt = r.fieldDate || (r.dateStart ? r.dateStart + (r.dateEnd && r.dateEnd !== r.dateStart ? ' - ' + r.dateEnd : '') : '—');
      var rProvSafe = esc(r.province).replace(/'/g, "\\'");
      var rMuniSafe = esc(r.municipality).replace(/'/g, "\\'");
      var rBrgySafe = esc(r.barangay).replace(/'/g, "\\'");
      return '<tr>' +
        '<td class="text-xs font-semibold text-slate-600 dark:text-slate-400">' + esc(r.province) + '</td>' +
        '<td class="text-xs font-bold text-dswd-blue dark:text-sky-400">' + esc(r.municipality) + '</td>' +
        '<td class="text-xs font-bold text-slate-800 dark:text-slate-100">' + esc(r.barangay) + '</td>' +
        '<td><span class="inline-block text-[10px] font-bold px-2 py-0.5 rounded bg-amber-100 text-amber-900 border border-amber-300 dark:bg-amber-950/60 dark:text-amber-300 dark:border-amber-700 mr-1.5">' + esc(r.seq || r.actCode) + '</span><span class="text-xs font-medium">' + esc(r.actLabel) + '</span></td>' +
        '<td class="text-xs text-slate-500 dark:text-slate-400">' + esc(dateTxt) + '</td>' +
        '<td style="text-align:center">' +
          '<button class="btn ghost p-1 px-2.5 rounded-lg text-xs font-bold text-dswd-blue border border-sky-200 dark:border-sky-800 hover:bg-sky-50 dark:hover:bg-sky-950/40 cursor-pointer" onclick="inspectNoAttRecord(\'' + rMuniSafe + '\', \'' + rProvSafe + '\', \'' + rBrgySafe + '\')">' +
            'Inspect' +
          '</button>' +
        '</td>' +
      '</tr>';
    }).join('') +
    '</tbody></table></div>';

  if (total > page.length) {
    html += '<div class="flex items-center justify-between gap-3 pt-3 text-xs text-slate-500 dark:text-slate-400">' +
      '<span>Showing ' + page.length + ' of ' + total + ' records</span>' +
      '<button type="button" class="btn ghost p-1 px-3 rounded-lg text-xs font-bold text-dswd-blue border border-sky-200 dark:border-sky-800 cursor-pointer" onclick="showMoreNoAttendees()">Show ' +
      Math.min(NO_ATT_PAGE, total - page.length) + ' more</button></div>';
  }

  el.innerHTML = html;
  refreshIcons(el);
}

function inspectNoAttRecord(municipality, province, barangay) {
  closeNoAttendeesModal();
  if (typeof openMuni === 'function') {
    openMuni(municipality, province);
  }
  if (barangay && barangay.indexOf('Municipal') === -1) {
    setTimeout(function () {
      if (typeof openBarangayDrawer === 'function') {
        openBarangayDrawer(barangay, municipality, province);
      }
    }, 350);
  }
}

function copyNoAttendeesList() {
  if (!_noAttRecords.length) {
    toast('No records to copy.', 'warn');
    return;
  }
  var lines = [];
  lines.push('====================================================');
  lines.push('DSWD KALAHI-CIDSS PCRP · CONDUCTED WITH NO ATTENDEES');
  lines.push('As of: ' + new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }));
  lines.push('Total Flagged Records: ' + _noAttRecords.length);
  lines.push('====================================================\n');

  _noAttRecords.forEach(function (r, i) {
    var dateTxt = r.fieldDate || (r.dateStart ? r.dateStart : 'Date not recorded');
    lines.push((i + 1) + '. ' + r.municipality + ' (' + r.province + ') · ' + r.barangay);
    lines.push('   Activity: ' + (r.seq ? r.seq + ' ' : '') + r.actLabel + ' [' + r.actCode + ']');
    lines.push('   Conducted: ' + dateTxt);
    lines.push('   Status: Marked conducted in field, but 0 attendees encoded in KCIS.');
    lines.push('');
  });

  lines.push('👉 Action Required: Upload participant attendance lists in KCIS to credit milestones.');
  var txt = lines.join('\n');
  navigator.clipboard.writeText(txt).then(function () {
    toast('List of ' + _noAttRecords.length + ' records copied to clipboard!', 'ok');
  }).catch(function () {
    toast('Failed to copy to clipboard.', 'err');
  });
}

// Close on backdrop click
var noAttModalEl = $('modal-no-attendees');
if (noAttModalEl) {
  noAttModalEl.addEventListener('click', function (e) {
    if (e.target === noAttModalEl) closeNoAttendeesModal();
  });
}

// ===================================================================
// RPMO APPRAISAL ROSTER MODAL
// ===================================================================

var _apprFilter = 'all';
var _apprSearch = '';
var _apprTimer = null;

function openAppraisalRosterModal() {
  var modal = $('modal-appraisal-roster');
  if (modal) modal.classList.add('open');
  if ($('appr-search')) $('appr-search').value = '';
  _apprSearch = '';
  _apprFilter = 'all';
  renderAppraisalRosterTable();
  if (modal) refreshIcons(modal);
}

function closeAppraisalRosterModal() {
  var modal = $('modal-appraisal-roster');
  if (modal) modal.classList.remove('open');
}

function setAppraisalModalFilter(flt) {
  _apprFilter = flt;
  renderAppraisalRosterTable();
}

function onAppraisalSearchInput() {
  clearTimeout(_apprTimer);
  _apprTimer = setTimeout(function () {
    _apprSearch = ($('appr-search') ? $('appr-search').value : '').toLowerCase().trim();
    renderAppraisalRosterTable();
  }, 150);
}

function renderAppraisalRosterTable() {
  var body = $('appr-roster-body');
  if (!body) return;

  var o = S.overview;
  if (!o) {
    body.innerHTML = '<div class="empty">No overview data loaded yet.</div>';
    return;
  }

  var allMunis = (o.municipalities || []).slice();
  var scopedMunis = allMunis.filter(function (m) {
    return !S.dashScope || S.dashScope === 'all' || m.province === S.dashScope;
  });

  var saved = o.appraisal || [];
  var statuses = o.appraisalStatuses || ['Not started', 'Endorsed to RPMO', 'Under appraisal', 'Cleared'];

  function getRec(m) {
    var p = normAlpha(m.province), mu = normAlpha(m.municipality);
    return saved.find(function (x) {
      return normAlpha(x.province) === p && normAlpha(x.municipality) === mu;
    }) || { status: 'Not started', date: '' };
  }

  var counts = { all: scopedMunis.length, 'Cleared': 0, 'Under appraisal': 0, 'Endorsed to RPMO': 0, 'Not started': 0 };
  scopedMunis.forEach(function (m) {
    var r = getRec(m);
    var st = counts[r.status] !== undefined ? r.status : 'Not started';
    counts[st]++;
  });

  if ($('appr-roster-count-badge')) {
    $('appr-roster-count-badge').textContent = counts['Cleared'] + ' of ' + counts.all + ' Cleared';
  }

  if ($('appr-chips-container')) {
    var chips = [
      { id: 'all', label: 'All', count: counts.all },
      { id: 'Cleared', label: 'Cleared', count: counts['Cleared'], cls: 'good' },
      { id: 'Under appraisal', label: 'Under appraisal', count: counts['Under appraisal'], cls: 'warn' },
      { id: 'Endorsed to RPMO', label: 'Endorsed', count: counts['Endorsed to RPMO'], cls: 'warn' },
      { id: 'Not started', label: 'Not started', count: counts['Not started'] }
    ];
    $('appr-chips-container').innerHTML = chips.map(function (c) {
      var isAct = _apprFilter === c.id ? ' active' + (c.cls ? ' chip-' + c.cls : '') : '';
      return '<button type="button" class="filter-chip text-xs' + isAct + '" onclick="setAppraisalModalFilter(\'' + esc(c.id) + '\')">' +
        '<span>' + esc(c.label) + '</span>' +
        '<span class="chip-count">' + c.count + '</span>' +
      '</button>';
    }).join('');
  }

  var filtered = scopedMunis.filter(function (m) {
    var r = getRec(m);
    var st = r.status || 'Not started';
    if (_apprFilter !== 'all' && st !== _apprFilter) return false;
    if (_apprSearch) {
      var q = _apprSearch;
      var text = (m.municipality + ' ' + m.province + ' ' + st + ' ' + (r.date || '')).toLowerCase();
      if (text.indexOf(q) === -1) return false;
    }
    return true;
  });

  filtered.sort(function (a, b) {
    var ra = getRec(a), rb = getRec(b);
    var order = { 'Under appraisal': 1, 'Endorsed to RPMO': 2, 'Not started': 3, 'Cleared': 4 };
    var diff = (order[ra.status] || 9) - (order[rb.status] || 9);
    if (diff !== 0) return diff;
    return a.municipality.localeCompare(b.municipality);
  });

  var isEditor = Boolean(o.editor || (typeof getEditorPasskey === 'function' && getEditorPasskey()));

  if (!filtered.length) {
    body.innerHTML = '<div class="empty py-10 text-center"><i data-lucide="check-circle" class="w-8 h-8 text-slate-300 mx-auto mb-2"></i>No municipalities match the selected filter.</div>';
    refreshIcons(body);
    return;
  }

  var html = '<div class="scroll rounded-2xl border border-slate-200 dark:border-slate-800">' +
    '<table class="w-full text-left border-collapse">' +
      '<thead>' +
        '<tr class="bg-slate-50 dark:bg-slate-800 text-[11px] font-bold uppercase tracking-wider text-slate-500">' +
          '<th class="p-3">Municipality</th>' +
          '<th class="p-3">Province</th>' +
          '<th class="p-3">RPMO Appraisal Status</th>' +
          '<th class="p-3">Status Date</th>' +
          '<th class="p-3">Stage 2 Readiness</th>' +
        '</tr>' +
      '</thead>' +
      '<tbody class="divide-y divide-slate-100 dark:divide-slate-800 text-xs">';

  filtered.forEach(function (m) {
    var r = getRec(m);
    var st = r.status || 'Not started';
    var dt = r.date || '';

    var pillCls = st === 'Cleared' ? 'good' : (st === 'Not started' ? 'idle' : 'warn');
    var isEligible = st === 'Cleared';

    var statusColHtml = '';
    var dateColHtml = '';

    if (isEditor) {
      statusColHtml = '<select class="appr-modal-sel p-1.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs font-bold text-slate-800 dark:text-slate-100 focus:ring-1 focus:ring-emerald-500" data-prov="' + esc(m.province) + '" data-muni="' + esc(m.municipality) + '">' +
        statuses.map(function (v) {
          return '<option value="' + esc(v) + '"' + (v === st ? ' selected' : '') + '>' + esc(v) + '</option>';
        }).join('') +
      '</select>';

      dateColHtml = '<input type="date" class="appr-modal-dt p-1.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs text-slate-800 dark:text-slate-100" data-prov="' + esc(m.province) + '" data-muni="' + esc(m.municipality) + '" value="' + esc(dt) + '">';
    } else {
      statusColHtml = '<span class="pill ' + pillCls + ' text-xs font-bold">' + esc(st) + '</span>';
      dateColHtml = dt ? '<span class="font-medium text-slate-700 dark:text-slate-300">' + esc(dt) + '</span>' : '<span class="text-slate-400">—</span>';
    }

    var stage2ColHtml = isEligible
      ? '<span class="inline-flex items-center gap-1.5 text-emerald-700 dark:text-emerald-400 font-bold"><i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-600"></i> Cleared for Stage 2</span>'
      : '<span class="inline-flex items-center gap-1.5 text-amber-700 dark:text-amber-400 font-semibold"><i data-lucide="clock" class="w-4 h-4 text-amber-500"></i> Pending Sign-Off</span>';

    html += '<tr class="hover:bg-slate-50/70 dark:hover:bg-slate-800/50 transition-colors">' +
      '<td class="p-3 font-bold text-slate-900 dark:text-slate-100">' +
        esc(m.municipality) +
        (m.batch ? ' <span class="text-[10px] text-slate-400 font-normal">(' + esc(m.batch) + ')</span>' : '') +
      '</td>' +
      '<td class="p-3 text-slate-600 dark:text-slate-400 font-medium">' + esc(m.province) + '</td>' +
      '<td class="p-3">' + statusColHtml + '</td>' +
      '<td class="p-3">' + dateColHtml + '</td>' +
      '<td class="p-3">' + stage2ColHtml + '</td>' +
    '</tr>';
  });

  html += '</tbody></table></div>';
  body.innerHTML = html;

  if (isEditor) {
    Array.prototype.forEach.call(body.querySelectorAll('.appr-modal-sel, .appr-modal-dt'), function (inputEl) {
      inputEl.addEventListener('change', function () {
        var tr = this.closest('tr');
        var sel = tr.querySelector('.appr-modal-sel');
        var dt = tr.querySelector('.appr-modal-dt');
        var prov = sel.getAttribute('data-prov');
        var muni = sel.getAttribute('data-muni');
        var newStatus = sel.value;
        var newDate = dt.value;

        sel.disabled = true;
        dt.disabled = true;
        toast('Saving ' + muni + ' appraisal status…', 'info');

        call('apiSetAppraisal', prov, muni, newStatus, newDate, getEditorPasskey()).then(function (o2) {
          S.overview = o2;
          toast(muni + ' appraisal updated to ' + newStatus + (newDate ? ' (' + newDate + ')' : ''), 'ok');
          renderAppraisalRosterTable();
          if (typeof renderDash === 'function') renderDash();
        }).catch(function (err) {
          toast(err.message, 'err');
          sel.disabled = false;
          dt.disabled = false;
        });
      });
    });
  }

  refreshIcons(body);
}

function copyAppraisalRosterText() {
  var o = S.overview;
  if (!o) return;

  var allMunis = (o.municipalities || []).slice();
  var scopedMunis = allMunis.filter(function (m) {
    return !S.dashScope || S.dashScope === 'all' || m.province === S.dashScope;
  });
  var saved = o.appraisal || [];

  function getRec(m) {
    var p = normAlpha(m.province), mu = normAlpha(m.municipality);
    return saved.find(function (x) {
      return normAlpha(x.province) === p && normAlpha(x.municipality) === mu;
    }) || { status: 'Not started', date: '' };
  }

  var scopeName = (!S.dashScope || S.dashScope === 'all') ? 'Caraga Region' : S.dashScope;
  var counts = { Cleared: 0, 'Under appraisal': 0, 'Endorsed to RPMO': 0, 'Not started': 0 };
  scopedMunis.forEach(function (m) {
    var r = getRec(m);
    var st = counts[r.status] !== undefined ? r.status : 'Not started';
    counts[st]++;
  });

  var lines = [
    '📍 DSWD KALAHI-CIDSS PCRP · RPMO TECHNICAL APPRAISAL ROSTER',
    '🏛️ Scope: ' + scopeName + ' (' + scopedMunis.length + ' Monitored Municipalities)',
    '📊 Status Overview: ' + counts.Cleared + '/' + scopedMunis.length + ' Cleared (' + (scopedMunis.length ? Math.round(counts.Cleared / scopedMunis.length * 100) : 0) + '%) · ' + counts['Under appraisal'] + ' Under Appraisal · ' + counts['Endorsed to RPMO'] + ' Endorsed · ' + counts['Not started'] + ' Not Started',
    '',
    'MUNICIPAL BREAKDOWN:'
  ];

  scopedMunis.forEach(function (m, idx) {
    var r = getRec(m);
    var dtStr = r.date ? ' (' + r.date + ')' : '';
    lines.push((idx + 1) + '. ' + m.municipality + ' (' + m.province + '): ' + r.status + dtStr + (r.status === 'Cleared' ? ' [Stage 2 Eligible]' : ''));
  });

  lines.push('');
  lines.push('Generated from PCRP Encoding Monitor');
  copyTextToClipboard(lines.join('\n'), 'RPMO Appraisal roster copied to clipboard!');
}

var apprModalEl = $('modal-appraisal-roster');
if (apprModalEl) {
  apprModalEl.addEventListener('click', function (e) {
    if (e.target === apprModalEl) closeAppraisalRosterModal();
  });
}

try { syncVersionBadges(); } catch (e) {}

// Global Application Startup Initialization
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', function () {
    try { syncVersionBadges(); } catch (e) {}
    boot();
  });
} else {
  try { syncVersionBadges(); } catch (e) {}
  boot();
}
</script>
